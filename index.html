<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <script>
    // Set the theme before the page paints. This avoids a flash of the wrong colours.
    (function () {
      try {
        var saved = localStorage.getItem('todo.theme');
        if (saved !== 'dark' && saved !== 'light') {
          saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {
        // Storage blocked. The stylesheet falls back to the system preference.
      }
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Todo</h1>
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-pressed="false"
        aria-label="Switch to dark theme"
        title="Switch to dark theme">
        <span id="theme-icon" class="theme-icon" aria-hidden="true">&#9790;</span>
      </button>
    </header>

    <form id="task-form" class="task-form" autocomplete="off">
      <input
        id="task-input"
        class="task-input"
        type="text"
        placeholder="What needs doing?"
        aria-label="New task"
        maxlength="200"
        required>
      <input
        id="task-due"
        class="task-due-input"
        type="date"
        aria-label="Deadline (optional)"
        title="Deadline (optional)">
      <button type="submit" class="add-btn">Add</button>
    </form>

    <ul id="task-list" class="task-list"></ul>

    <p id="empty-state" class="empty-state">No tasks yet. Add one above.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
